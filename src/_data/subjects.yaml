# The site's database. One entry per subject written about.
#
# key      -> the URL slug: /s/<key>/ , and the essay filename in games/<key>.md
# title    -> display name
# category -> list; drives shelf membership only. Soft: edit freely, URLs don't move.
# status   -> active    | on the go now. This is what drives Now Playing.
#             completed | finished it
#             shelved   | paused, might come back
#             abandoned | done with it, not coming back
# rating   -> optional
# cover    -> optional; omit and the shelf falls back to a text list
# aliases  -> headings that resolve here. The title always matches automatically.
#
# A "## heading" in a daily post that matches nothing gets a build warning and
# stays only in that post. Nothing is ever auto-created.

dragon-quest-xi-s:
