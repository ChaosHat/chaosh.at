# Every status and rating change, oldest first: one entry per subject per
# night. publish.py appends the night's differences (tonight's subjects.yaml
# against where this log, or failing that last night's copy, leaves each
# subject), dated the day that ended. Hand edits are fine: fix a date (status
# changes often lag the writing), or add `why: <essay filename>` to link the
# essay that argued a change. Canon in/out are ordinary rating entries and
# /canon/'s changelog is drawn from them; never edit this to make a swap.
# `timeline: false` on a status entry keeps the active stretch that entry
# opens or closes off the year page's timeline (a per-run opt-out; the game
# stays on the year's shelves, and nothing else reads the key).
