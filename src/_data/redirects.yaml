# URLs that were live and moved. GitHub Pages serves static files and has no
# server-side redirect, so each of these becomes a meta-refresh stub with a
# rel=canonical pointing at the real page — which is what a crawler needs and
# what a bookmark or an inbound link survives on.
#
# Kept as data rather than a hand-written file per move, so "did you leave a
# redirect?" is a question with one place to check the next time something is
# renamed. Entries are permanent; the cost of one is a 400-byte file.

- from: /t/favorites/
  to: /r/canon/
  # Renamed 2026-09-04. A game doesn't stop being a favourite when it loses its
  # slot, so "favorite" claimed a permanence the ten-slot roster doesn't have.
  # Pointed straight at /r/canon/ on 2026-10-22 rather than chaining through
  # the /t/canon/ stub below.

- from: /t/canon/
  to: /r/canon/
  # 2026-10-22: canon stopped being a tagview and became the top rung of the
  # rating ladder. Same view — everything written about the ten — now built
  # from `rating: canon`. The ten's own page, with its history, is /canon/.

- from: /shelf/games/
  to: /shelf/
- from: /shelf/boardgames/
  to: /shelf/tabletop/
  # Retargeted 2026-10-25: tabletop has its own shelf again, as a medium.
  # Merged 2026-09-11. One shelf, category as a filter chip beside the sort;
  # the second shelf had one tile and a nav link of its own.
