# Carried to the repo by publish.py on every run, same as subjects.yaml and
# tagviews.yaml — this vault copy is the one to edit, never the repo's.
title: chaosh.at
url: https://chaosh.at
author: Hat
description: Games, books, shows, and whatever else.
bluesky: chaosh.at

# Standing lines under the masthead saying what the auroras are. Leave empty and
# nothing renders — no placeholder, no empty box. Each line renders as its own
# line on the site; keep it to a few, it sits above Now Playing.
#
# Worth knowing before editing: hue means nothing. Each subject's colour is a
# hash on a ladder, picked so registering a subject needs no assets. The axes
# that DO carry meaning are how much aurora is in the sky (status) and how
# brightly it burns (how recently you wrote about it). Copy that explains the
# colours would be explaining something that isn't there.
intro: |-
  When the sky is excited, it writes an aurora for all to see. When I'm excited, I write about games on a blog.
  Same thing.
