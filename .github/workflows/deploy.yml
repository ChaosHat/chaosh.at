name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Recency tiers (how brightly a sky burns) and the masthead's daily hue are
  # computed at build time — without this, a quiet week freezes both at the
  # last push and the shelves claim "wrote about it this week" indefinitely.
  # 07:30 UTC sits after the 02:00 America/New_York publish in both EST and EDT.
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CHAOSH_BIRTHDATE: ${{ secrets.CHAOSH_BIRTHDATE }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # The vault side is loud — every refusal reaches the phone at 2am — while
      # a build that dies up here reaches nobody, and the live site just quietly
      # stops moving. Same ntfy topic as the publish run, so there is one feed
      # to watch. Never fails the job: the build already failed, and a second
      # failure on top of it only obscures the first.
      - name: Notify on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          JOB: ${{ github.job }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC unset — no alert sent."
            exit 0
          fi
          auth=()
          if [ -n "$NTFY_TOKEN" ]; then
            auth=(-H "Authorization: Bearer $NTFY_TOKEN")
          fi
          curl -sS --max-time 10 \
            -H "Title: chaosh.at build failed" \
            -H "Priority: high" \
            -H "Tags: warning" \
            "${auth[@]}" \
            -d "The $JOB job failed ($TRIGGER). The site is serving the last good build.
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "https://ntfy.hatnas.com/$NTFY_TOPIC" || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # The vault side is loud — every refusal reaches the phone at 2am — while
      # a build that dies up here reaches nobody, and the live site just quietly
      # stops moving. Same ntfy topic as the publish run, so there is one feed
      # to watch. Never fails the job: the build already failed, and a second
      # failure on top of it only obscures the first.
      - name: Notify on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          JOB: ${{ github.job }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC unset — no alert sent."
            exit 0
          fi
          auth=()
          if [ -n "$NTFY_TOKEN" ]; then
            auth=(-H "Authorization: Bearer $NTFY_TOKEN")
          fi
          curl -sS --max-time 10 \
            -H "Title: chaosh.at build failed" \
            -H "Priority: high" \
            -H "Tags: warning" \
            "${auth[@]}" \
            -d "The $JOB job failed ($TRIGGER). The site is serving the last good build.
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "https://ntfy.hatnas.com/$NTFY_TOPIC" || true
