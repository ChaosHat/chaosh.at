name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Recency tiers (how brightly a sky burns) and the masthead's daily hue are
  # computed at build time — without this, a quiet week freezes both at the
  # last push and the shelves claim "wrote about it this week" indefinitely.
  # 07:30 UTC sits after the 02:00 America/New_York publish in both EST and EDT.
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Production (main, and the scheduled runs, which always run on main) queues in
# one group so deploys never overlap. A hand-run preview from another branch
# gets a group of its own, so it can't cancel a pending production deploy.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pages-preview-{0}', github.ref_name) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Builds take 1-2 minutes; this only exists to stop a hung run from holding
    # the production concurrency group (GitHub's default is 6 hours).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      # The render cache (2026-11-04): post mastheads by date (.cache/aurora)
      # and link cards (.cache/og). Without it every build redraws both from
      # scratch — a masthead set per post ever written, ~140ms each. Caches
      # are immutable once saved, so each run saves under its own key and
      # restores the newest one drawn by the same code; a renderer change
      # misses and starts clean. Both caches also key their own entries on
      # the code (eleventy.config.js mastheadHash, og.js keyOf), so a stale
      # restore could only waste space. Old runs' entries age out under
      # GitHub's cache eviction.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: render-${{ hashFiles('aurora.js', 'png.js', 'og.js', 'og-fonts/**') }}-${{ github.run_id }}
          restore-keys: render-${{ hashFiles('aurora.js', 'png.js', 'og.js', 'og-fonts/**') }}-
      - run: npm ci
      - run: npm run build
        env:
          CHAOSH_BIRTHDATE: ${{ secrets.CHAOSH_BIRTHDATE }}
      # main → production; any other branch (run it by hand from the Actions
      # tab) → a preview at <branch>.chaosh-at.pages.dev. wrangler also picks
      # up ./functions from the repo root.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=chaosh-at --branch=${{ github.ref_name }}

      # The vault side is loud — every refusal reaches the phone at 2am — while
      # a build that dies up here reaches nobody, and the live site just quietly
      # stops moving. Same ntfy topic as the publish run, so there is one feed
      # to watch. Never fails the job: the build already failed, and a second
      # failure on top of it only obscures the first.
      - name: Notify on failure
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          JOB: ${{ github.job }}
          TRIGGER: ${{ github.event_name }}
          STATUS: ${{ job.status }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC unset — no alert sent."
            exit 0
          fi
          auth=()
          if [ -n "$NTFY_TOKEN" ]; then
            auth=(-H "Authorization: Bearer $NTFY_TOKEN")
          fi
          curl -sS --max-time 10 \
            -H "Title: chaosh.at build failed" \
            -H "Priority: high" \
            -H "Tags: warning" \
            "${auth[@]}" \
            -d "The $JOB job ended $STATUS ($TRIGGER). The site is serving the last good build.
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "https://ntfy.hatnas.com/$NTFY_TOPIC" || true

