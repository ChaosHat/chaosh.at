name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Recency tiers (how brightly a sky burns) and the masthead's daily hue are
  # computed at build time — without this, a quiet week freezes both at the
  # last push and the shelves claim "wrote about it this week" indefinitely.
  # GitHub queues scheduled runs under load: this has fired anywhere from
  # 12:00 to 17:45 UTC (Oct-Nov 2026), not at 07:30. So since 2026-11-11 the
  # 2am publish run asks for the build itself on a night it pushes nothing
  # (workflow_dispatch below), and this cron is the fallback for a night that
  # machine is off. The cron itself is right:
  # 07:30 UTC sits after the 02:00 America/New_York publish in both EST and EDT.
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Production (main, and the scheduled runs, which always run on main) queues in
# one group so deploys never overlap. A hand-run preview from another branch
# gets a group of its own, so it can't cancel a pending production deploy.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'pages' || format('pages-preview-{0}', github.ref_name) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Builds take 1-2 minutes; this only exists to stop a hung run from holding
    # the production concurrency group (GitHub's default is 6 hours).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      # The render cache (2026-11-04): post mastheads by date (.cache/aurora)
      # and link cards (.cache/og). Without it every build redraws both from
      # scratch — a masthead set per post ever written, ~140ms each. Caches
      # are immutable once saved, so each run saves under its own key and
      # restores the newest one drawn by the same code; a renderer change
      # misses and starts clean. Both caches also key their own entries on
      # the code (eleventy.config.js mastheadHash, og.js keyOf), so a stale
      # restore could only waste space. Old runs' entries age out under
      # GitHub's cache eviction.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: render-${{ hashFiles('aurora.js', 'png.js', 'og.js', 'og-fonts/**') }}-${{ github.run_id }}
          restore-keys: render-${{ hashFiles('aurora.js', 'png.js', 'og.js', 'og-fonts/**') }}-
      - run: npm ci
      - run: npm run build
        env:
          CHAOSH_BIRTHDATE: ${{ secrets.CHAOSH_BIRTHDATE }}
      # main → production; any other branch (run it by hand from the Actions
      # tab) → a preview at <branch>.chaosh-at.pages.dev. wrangler also picks
      # up ./functions from the repo root.
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=chaosh-at --branch=${{ github.ref_name }}

      # Headroom tripwire (2026-11-13). Cloudflare Pages' free plan refuses a
      # deploy over 20,000 files (or any file over 25 MiB), and GitHub asks
      # for repos under 1 GB. ~1,900 files and ~210 MB in Nov 2026, growing
      # ~5,500 files and ~330 MB a year — this pings the publish run's ntfy
      # topic, every deploy, once either crosses its line, so there are months
      # to move post images to R2 (or trim the generated sky/aurora art) before
      # a deploy actually fails. Never fails the job.
      - name: Headroom check
        if: success()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(find _site -type f | wc -l)
          big=$(find _site -type f -size +20M | head -3 | tr '\n' ' ' || true)
          repo_mb=$(( $(gh api "repos/$GITHUB_REPOSITORY" --jq .size 2>/dev/null || echo 0) / 1024 ))
          echo "site files: $files / 20000 · repo: ${repo_mb} MB · files over 20 MB: ${big:-none}"
          msg=""
          [ "$files" -gt 15000 ] && msg+="Site is $files files; Cloudflare Pages refuses a deploy over 20,000. "
          [ "$repo_mb" -gt 800 ] && msg+="Repo is ${repo_mb} MB; GitHub asks for under 1 GB. "
          [ -n "$big" ] && msg+="Files near the 25 MiB per-file limit: $big"
          if [ -z "$msg" ] || [ -z "$NTFY_TOPIC" ]; then exit 0; fi
          auth=()
          [ -n "$NTFY_TOKEN" ] && auth=(-H "Authorization: Bearer $NTFY_TOKEN")
          curl -sS --max-time 10 -H "Title: chaosh.at nearing a hosting limit" \
            -H "Tags: chart_with_upwards_trend" "${auth[@]}" \
            -d "${msg}Plan: vault Open Questions → Hosting headroom." \
            "https://ntfy.hatnas.com/$NTFY_TOPIC" || true

      # The vault side is loud — every refusal reaches the phone at 2am — while
      # a build that dies up here reaches nobody, and the live site just quietly
      # stops moving. Same ntfy topic as the publish run, so there is one feed
      # to watch. Never fails the job: the build already failed, and a second
      # failure on top of it only obscures the first.
      - name: Notify on failure
        if: failure() || cancelled()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          JOB: ${{ github.job }}
          TRIGGER: ${{ github.event_name }}
          STATUS: ${{ job.status }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC unset — no alert sent."
            exit 0
          fi
          auth=()
          if [ -n "$NTFY_TOKEN" ]; then
            auth=(-H "Authorization: Bearer $NTFY_TOKEN")
          fi
          curl -sS --max-time 10 \
            -H "Title: chaosh.at build failed" \
            -H "Priority: high" \
            -H "Tags: warning" \
            "${auth[@]}" \
            -d "The $JOB job ended $STATUS ($TRIGGER). The site is serving the last good build.
          $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "https://ntfy.hatnas.com/$NTFY_TOPIC" || true

