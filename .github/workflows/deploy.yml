name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Recency tiers (how brightly a sky burns) and the masthead's daily hue are
  # computed at build time — without this, a quiet week freezes both at the
  # last push and the shelves claim "wrote about it this week" indefinitely.
  # 07:30 UTC sits after the 02:00 America/New_York publish in both EST and EDT.
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
